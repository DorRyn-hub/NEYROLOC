name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UI test dependency
        run: python -m pip install --disable-pip-version-check "PySide6==6.11.1"

      - name: Unit and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Python syntax
        run: >-
          python -m compileall -q
          main.py start.py NEYROLOCK_5/backends NEYROLOCK_5/core
          NEYROLOCK_5/ui deploy tests

      - name: Script syntax
        run: |
          bash -n packaging/build_app.sh packaging/build_standalone_macos.sh packaging/android/build_apk.sh
          zsh -n START_NEYROLOC_NEW.command
          clang -Wall -Wextra -Werror -fsyntax-only packaging/launcher.c

      - name: PWA JavaScript syntax
        run: >-
          node -e
          "const fs=require('fs'),s=fs.readFileSync('NEYROLOCK_5/resources/mobile.html','utf8'),m=s.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('inline script not found');new Function(m[1]);"

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
